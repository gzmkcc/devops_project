---
- name: Update deployment image
  raw: kubectl set image deployment/app-deployment app=gizemk/devops-case-app:{{ image_tag }} -n app

- name: Wait for rollout to complete
  raw: kubectl rollout status deployment/app-deployment -n app
  register: rollout_status

- name: Print rollout status
  debug:
    msg: "{{ rollout_status.stdout }}"
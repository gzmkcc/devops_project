config:
  outputs: |
    [OUTPUT]
        Name es
        Match kube.*
        Host 10.98.242.15
        Port 9200
        Logstash_Format On
        Logstash_Prefix kubernetes
        Replace_Dots On
        Retry_Limit False
        tls Off
        tls.verify Off
        Suppress_Type_Name On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi